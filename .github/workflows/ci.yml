name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支连续推送时取消上一轮未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 静态检查只跑一遍（最快的 Python 上）
  PRIMARY_PYTHON: "3.12"

jobs:
  lint:
    name: 静态检查（ruff + mypy）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tools tests
      - name: ruff format --check
        run: ruff format --check src tools tests
      - name: mypy
        run: mypy

  test:
    name: 测试（Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 上跑全部 Python 版本；Windows 只跑主版本，
        # 因为本项目大量路径/中文路径逻辑与 Windows 强相关，值得单独覆盖
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖（含 GUI 与 deep 引擎，测试里有 Qt 用例和真实样张准确率门槛）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui,deep]"

      - name: 运行测试
        env:
          # Qt 用例在无显示环境下跑（CI 没有 X）
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ --timeout=300 -ra

  # 说明：定位回归基线（tests/test_regression_baseline.py，cv 引擎行为快照）
  # 与真实样张准确率门槛（tests/test_real_samples_accuracy.py，deep 引擎
  # + tests/baselines/ground_truth.json 人工真值）都已包含在上面的 pytest 里，
  # 不需要单独 job —— 两者用的都是仓库内自带的真实样张（img/ + samples/），
  # 前者确定性 cv 引擎、后者 OCR 模型随 wheel 分发，均不依赖外部数据集下载。
  #
  # 想评更大规模的真实准确率，请在本地用 tools/eval_locate.py 配合自己的
  # 数据集跑，例如：
  #   python tools/eval_locate.py datasets/hg/test --grid quick
