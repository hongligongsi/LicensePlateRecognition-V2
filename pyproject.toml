[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpr-v2"
version = "2.7.1"
description = "中国车牌识别 v2 —— 传统 CV + 深度学习双引擎（升级自 hongligongsi/License-Plate-Recognition）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "License-Plate-Recognition contributors" }]
keywords = ["license-plate", "ocr", "opencv", "车牌识别", "lpr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.10,<5",
    # rapidocr 声明的是无上限的 opencv_python>=4.5.1，会拉入 cv2 5.x；
    # 5.x 移除了 ml.SVM_load（传统引擎加载 svm.dat 必需），且与 headless
    # 同装时后安装者抢占 cv2 命名空间。这里显式给常规包也加上限双保险。
    "opencv-python>=4.5.1,<5",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# 深度学习引擎（推荐，精度显著高于传统 CV）
#: rapidocr-onnxruntime 的 1.2.x 暴露 ``text_recognizer`` 与
#: ``get_boxes_img_without_det``（deep_engine 靠它跳过检测网络做"纯识别"提速，
#: 单图 8~55ms）；1.4.x 改成 ``text_rec`` 且移除了该 helper，快路径被判为不可用，
#: 每张图退化成全图检测（单图 0.3~1s+），对抗样张门槛测试因此在 CI 上超时。
#: 版本还必须**钉死**在 1.2.3：随包分发的模型在 1.2.13 上有漂移，
#: ``img/single_blue.jpg`` 的 V 被读成 9，真实样张门槛因此掉到 90%（=门槛）
#: 而在 linux/py3.10、py3.11 上红。1.2.3 是本仓库离线实测通过的那一版
#: （同一个 onnxruntime 1.31.0 下，1.2.3 过、1.2.13 不过，判别因子是 rapidocr）。
deep = ["rapidocr-onnxruntime==1.2.3"]
deep-paddle = ["paddleocr>=2.7", "paddlepaddle>=2.5"]
# 检测识别引擎（第三引擎）：车牌专用检测网络 + 识别，对侧倾/模糊车牌定位更鲁棒
#: 只依赖 onnxruntime —— 刻意不引入 torch，安装体积保持在几十 MB。
#: 权重（models/yolo/*.onnx）不随包分发，需用户自行下载，见 docs/THIRD_PARTY.md。
yolo = ["onnxruntime>=1.16"]
# 图形界面
#: 界面只 import QtCore / QtGui / QtWidgets，全在 Essentials 里。
#: 直接依赖元包 PySide6 会连带拉 PySide6-Addons（WebEngine / Charts /
#: Multimedia / 3D…，约 130 MB）——本项目一个都不用，故只装 Essentials。
gui = ["PySide6-Essentials>=6.5"]
# 开发（含静态检查）
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.2",
    "ruff>=0.6",
    "mypy>=1.10",
    # onnx 只给测试与 tools/make_stub_onnx.py 用：有了它才能**不依赖任何
    # 第三方权重**就构造出桩模型，把 yolo 引擎的整条推理链路（会话建立 →
    # letterbox → 解码 → NMS → 逆变换 → 角点矫正）在 CI 上真跑一遍。
    # 纯运行不需要它 —— 推理走 onnxruntime。
    "onnx>=1.16",
]

[project.scripts]
lpr = "lpr.cli:main"

[project.urls]
Homepage = "https://github.com/hongligongsi/LicensePlateRecognition-V2"
Source = "https://github.com/hongligongsi/LicensePlateRecognition-V2"
Issues = "https://github.com/hongligongsi/LicensePlateRecognition-V2/issues"

[tool.setuptools.packages.find]
where = ["src"]

#: 声明为 typed 包（配合 src/lpr/py.typed），下游才敢依赖我们的类型标注
[tool.setuptools.package-data]
lpr = ["py.typed"]

# ────────────────────────────────────────────────────────────────
# 测试
# ────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: 会真正启动多进程/加载模型的较重测试（可用 -m 'not slow' 跳过）",
]
#: 说明：不在此处写 ``timeout=``，因为 pytest-timeout 属于可选依赖，
#: 未安装时该键会产生 "Unknown config option" 警告。CI 与本地想启用超时请用
#: ``pytest --timeout=300``（详见 .github/workflows/ci.yml）。

# ────────────────────────────────────────────────────────────────
# 静态检查（ruff = lint + format，mypy = 类型）
# ────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff 专有规则
]
ignore = [
    "E501",    # 行长由 formatter 负责，docstring/中文注释常超 100
    "RUF001",  # 中文注释里的全角标点不算"歧义字符"
    "RUF002",
    "RUF003",
    "B008",    # 允许在默认参数里调用工厂函数
    "SIM108",  # 三元表达式不总是更清晰
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"tools/*" = ["E402"]  # 工具脚本需要先 sys.path 再 import

[tool.ruff.lint.isort]
known-first-party = ["lpr"]

[tool.mypy]
python_version = "3.10"
files = ["src/lpr"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
#: 逐步收紧：先保证核心契约与数据结构是干净的
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["lpr.ui.*"]
#: Qt 的信号/槽装饰器在类型层面噪声很大，单独放宽
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cv2", "rapidocr_onnxruntime", "paddleocr", "PySide6.*"]
ignore_missing_imports = true
